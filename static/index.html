<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Depth Studio</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <a class="brand" href="/">Depth Studio</a>
      <a class="pill" id="serverStatus" href="#queue" title="서버 대기열 보기">서버 확인 중…</a>
      <div class="spacer"></div>
      <a class="btn" href="/editor">프레임 편집기 <span class="beta">BETA</span></a>
    </header>

    <div class="grid-2">
      <div class="stack">
        <section class="card">
          <h2>1. 영상 업로드</h2>
          <div id="uploadBox">
            <div class="dropzone" id="dropzone">
              <strong>영상을 끌어다 놓거나 클릭해서 선택</strong>
              <span id="uploadHint">mp4 · mov · mkv · webm</span>
            </div>
          </div>
          <div id="mediaBox" class="stack" hidden></div>
        </section>

        <section class="card" id="optionsCard" hidden>
          <h2>2. 변환 설정</h2>
          <div class="stack">
            <div id="depthOptions"></div>
            <div class="form">
              <label>컷 감지 민감도</label>
              <div class="inline">
                <input type="range" id="cutThreshold" min="2" max="60" step="1">
                <span class="val" id="cutThresholdVal"></span>
              </div>
              <div class="note full" id="cutInfo"></div>
              <label>출력</label>
              <div class="stack" style="gap:6px">
                <label class="check"><input type="checkbox" id="outMp4" checked> Depth 영상 (mp4, 흑백)</label>
                <label class="check"><input type="checkbox" id="outPng"> 16bit PNG 시퀀스 (zip)</label>
              </div>
              <label>오디오</label>
              <label class="check"><input type="checkbox" id="outAudio" checked> 원본 오디오 유지 (mp4에 포함)</label>
            </div>
            <div class="row">
              <button class="primary" id="startBtn">Depth 변환 시작</button>
              <span class="note" id="startNote"></span>
            </div>
          </div>
        </section>
      </div>

      <div class="stack">
        <section class="card">
          <h2>3. 내 작업</h2>
          <div class="jobs" id="jobs"></div>
          <p class="note" id="jobsEmpty">아직 작업이 없습니다. 결과 파일은 서버에 <span id="ttl">24</span>시간 보관됩니다.</p>
        </section>

        <section class="card" id="queue">
          <h2>서버 대기열 <span class="note" id="queueSummary"></span></h2>
          <div class="queue" id="queueList"></div>
          <p class="note">모든 사용자의 작업이 GPU 하나에서 위에서부터 순서대로 처리됩니다. <span class="mine-tag">내 작업</span> 표시는 이 브라우저에서 넣은 작업입니다.</p>
        </section>
      </div>
    </div>
  </div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
